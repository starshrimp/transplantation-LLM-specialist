# Transplantation-medicine evaluation prompts.
#
# Fields:
#   id                 stable identifier (do NOT reuse an id for a new question)
#   domain             subdomain, used for grouping in results
#   cognitive_level    recall | completeness | reasoning | application | nuance
#   text               the exact prompt sent to every model (English)
#   text_de            German translation of the prompt
#   expected_key_points      factual statements a strong answer should contain (English)
#   expected_key_points_de   German equivalents of the key-point statements

- id: P01_rejection_types
  domain: Immunology / rejection
  cognitive_level: reasoning
  text: >
    Explain the difference between hyperacute, acute, and chronic rejection in
    solid organ transplantation, including the immunological mechanisms and the
    typical time course of each.
  expected_key_points:
    - "Hyperacute rejection is caused by preformed donor-specific antibodies and complement activation; it occurs within minutes to hours of transplantation."
    - "Hyperacute rejection is now rare because of pre-transplant crossmatching."
    - "Acute rejection involves T-cell-mediated (cellular) and/or antibody-mediated (AMR/humoral) mechanisms; it occurs days to months post-transplant and is treatable."
    - "Chronic rejection is multifactorial (immune and non-immune factors), develops over months to years, and leads to fibrosis/vasculopathy that is largely irreversible."
    - "Rejection diagnosis is confirmed by biopsy using Banff classification criteria."
  text_de: >
    Erläutern Sie den Unterschied zwischen hyperakuter, akuter und chronischer Abstossung
    bei der Organtransplantation, einschliesslich der immunologischen Mechanismen und des
    typischen zeitlichen Verlaufs jeder Form.
  expected_key_points_de:
    - "Hyperakute Abstossung entsteht durch präformierte donorspezifische Antikörper mit Komplementaktivierung und tritt innerhalb von Minuten bis Stunden nach Transplantation auf."
    - "Hyperakute Abstossung ist heute selten dank präoperativer Kreuzprobe."
    - "Akute Abstossung umfasst T-Zell-vermittelte (zelluläre) und/oder antikörpervermittelte (AMR/humorale) Mechanismen; sie tritt Tage bis Monate nach Transplantation auf und ist behandelbar."
    - "Chronische Abstossung ist multifaktoriell (immunologisch und nicht-immunologisch), entwickelt sich über Monate bis Jahre und führt zu Fibrose/Vaskulopathie, die weitgehend irreversibel ist."
    - "Die Abstossungsdiagnose wird per Biopsie gesichert und nach Banff-Kriterien klassifiziert."

- id: P02_tac_clarithromycin
  domain: Pharmacology / drug interaction
  cognitive_level: application
  text: >
    A kidney transplant recipient stable on tacrolimus is started on a course of
    clarithromycin for a respiratory infection. What is the clinically important
    interaction, what is the mechanism, and how should it be managed?
  expected_key_points:
    - "Clarithromycin is a strong CYP3A4 (and P-gp) inhibitor; tacrolimus is a CYP3A4 substrate."
    - "Co-administration causes tacrolimus levels to RISE, increasing the risk of nephrotoxicity and over-immunosuppression."
    - "Management includes switching to an alternative antibiotic (e.g. azithromycin) or pre-emptively reducing the tacrolimus dose with close trough-level monitoring."
    - "Stating that tacrolimus levels fall, or advising a dose increase, would be clinically dangerous."
  text_de: >
    Eine nierentransplantierte Patientin unter stabiler Tacrolimus-Therapie erhält
    Clarithromycin wegen einer Atemwegsinfektion. Was ist die klinisch relevante
    Wechselwirkung, was ist der Mechanismus, und wie sollte sie gemanagt werden?
  expected_key_points_de:
    - "Clarithromycin ist ein starker CYP3A4- (und P-gp-)Inhibitor; Tacrolimus ist ein CYP3A4-Substrat."
    - "Die Kombination führt zu einem ANSTIEG der Tacrolimus-Spiegel mit Risiko für Nephrotoxizität und Überimmunsuppression."
    - "Das Management umfasst den Wechsel zu einem alternativen Antibiotikum (z.B. Azithromycin) oder eine prophylaktische Dosisreduktion von Tacrolimus mit engmaschiger Talspiegel-Überwachung."
    - "Die Angabe, dass Tacrolimus-Spiegel sinken, oder eine Dosiserhöhung zu empfehlen wäre klinisch gefährlich."

- id: P03_ch_kidney_allocation
  domain: Allocation policy (Switzerland)
  cognitive_level: recall
  text: >
    Describe how deceased-donor kidneys are allocated in Switzerland under the
    current national allocation system. Which factors determine priority?
  expected_key_points:
    - "The national allocation system in Switzerland is administered by Swisstransplant (SOAS)."
    - "Allocation factors include blood group, HLA match/mismatch, waiting time, highly sensitised patients (cPRA priority), age matching, paediatric priority, and medical urgency."
    - "The model names details specific to the Swiss system rather than only generic allocation principles."
  text_de: >
    Beschreiben Sie, wie verstorbene Spendernieren in der Schweiz im Rahmen des aktuellen
    nationalen Zuteilungssystems zugeteilt werden. Welche Faktoren bestimmen die Priorität?
  expected_key_points_de:
    - "Das nationale Zuteilungssystem in der Schweiz wird durch Swisstransplant (SOAS) koordiniert."
    - "Zuteilungsfaktoren umfassen Blutgruppe, HLA-Übereinstimmung/-Mismatch, Wartezeit, hochsensibilisierte Patienten (cPRA-Priorität), Altersabgleich, pädiatrische Priorität und medizinische Dringlichkeit."
    - "Das Modell nennt schweizspezifische Details und nicht nur generische Zuteilungsprinzipien."

- id: P04_dbd_donor_management
  domain: Donor management
  cognitive_level: completeness
  text: >
    List the essential components of donor management for a brain-dead (DBD)
    potential multi-organ donor in the ICU, aimed at optimising organ viability.
  expected_key_points:
    - "Haemodynamic support includes maintaining euvolaemia, using vasopressors, and treating diabetes insipidus with desmopressin."
    - "Hormonal resuscitation includes vasopressin, thyroid hormone, and corticosteroids."
    - "Lung-protective ventilation is applied, with strict control of temperature, electrolytes, and glucose."
    - "Coagulation management, infection surveillance, and serology/HLA typing for organ matching are performed."
  text_de: >
    Nennen Sie die wesentlichen Massnahmen des Spendermanagements für einen hirntoten (DBD)
    potenziellen Multiorgan-Spender auf der Intensivstation zur Optimierung der
    Organvitalität.
  expected_key_points_de:
    - "Hämodynamische Stabilisierung umfasst Euvolämie, Vasopressoren und Behandlung des Diabetes insipidus mit Desmopressin."
    - "Hormonelle Resuszitation umfasst Vasopressin, Schilddrüsenhormon und Kortikosteroide."
    - "Lungenprotektive Beatmung wird eingesetzt, mit strikter Kontrolle von Temperatur, Elektrolyten und Glukose."
    - "Gerinnungsmanagement, Infektionsüberwachung und Serologie/HLA-Typisierung für das Organ-Matching werden durchgeführt."

- id: P05_hla_sensitisation
  domain: Immunology / matching
  cognitive_level: reasoning
  text: >
    Explain how HLA sensitisation occurs, how it is detected (e.g. PRA/cPRA and
    donor-specific antibodies), and why it affects both access to transplantation
    and post-transplant outcomes.
  expected_key_points:
    - "HLA sensitisation arises through sensitising events: blood transfusion, pregnancy, or prior transplant."
    - "Sensitisation is detected via PRA/cPRA and single-antigen bead (Luminex) assay for DSA, along with virtual and physical crossmatch."
    - "High sensitisation leads to longer waiting time and fewer compatible donors."
    - "Donor-specific antibodies (DSA) increase the risk of antibody-mediated rejection (AMR) and graft loss."
    - "The model connects sensitisation mechanism, diagnostic testing, and clinical consequences coherently."
  text_de: >
    Erklären Sie, wie eine HLA-Sensibilisierung entsteht, wie sie nachgewiesen wird
    (z.B. PRA/cPRA und donorspezifische Antikörper), und warum sie sowohl den Zugang zur
    Transplantation als auch die Ergebnisse nach der Transplantation beeinflusst.
  expected_key_points_de:
    - "HLA-Sensibilisierung entsteht durch sensibilisierende Ereignisse: Bluttransfusion, Schwangerschaft oder Vortransplantation."
    - "Nachweis erfolgt über PRA/cPRA und Single-Antigen-Bead (Luminex)-Test für DSA sowie virtuellen und physischen Kreuztest."
    - "Hohe Sensibilisierung führt zu längerer Wartezeit und weniger kompatiblen Spendern."
    - "Donorspezifische Antikörper (DSA) erhöhen das Risiko für antikörpervermittelte Abstossung (AMR) und Transplantatverlust."
    - "Das Modell verknüpft Sensibilisierungsmechanismus, Diagnostik und klinische Konsequenzen kohärent."

- id: P06_machine_perfusion_liver
  domain: Preservation / perfusion
  cognitive_level: nuance
  text: >
    Compare static cold storage with normothermic machine perfusion for liver
    transplantation. What are the proposed benefits, and what does current
    evidence suggest about outcomes?
  expected_key_points:
    - "Static cold storage (SCS) is simple and cost-effective but limits ischaemic time and does not allow organ viability assessment."
    - "Normothermic machine perfusion (NMP) maintains organ metabolism at physiological temperature and enables viability testing before implantation."
    - "NMP may reduce early allograft dysfunction and allows use of marginal or DCD grafts."
    - "The model cites current evidence supporting NMP benefits without overclaiming definitive superiority across all outcomes."
  text_de: >
    Vergleichen Sie die statische Kaltlagerung mit der normothermen maschinellen Perfusion
    für die Lebertransplantation. Was sind die postulierten Vorteile, und was legt die
    aktuelle Evidenz bezüglich der Ergebnisse nahe?
  expected_key_points_de:
    - "Statische Kaltlagerung (SKL) ist einfach und kostengünstig, begrenzt jedoch die Ischämiezeit und ermöglicht keine Vitalitätsbeurteilung des Organs."
    - "Normotherme maschinelle Perfusion (NMP) erhält den Organstoffwechsel bei physiologischer Temperatur und ermöglicht eine Vitalitätsprüfung vor der Implantation."
    - "NMP kann frühes Allotransplantatversagen reduzieren und ermöglicht die Nutzung marginaler oder DCD-Organe."
    - "Das Modell zitiert aktuelle Evidenz für die Vorteile der NMP, ohne eine definitive Überlegenheit bei allen Outcomes zu behaupten."

- id: P07_kidney_dysfunction_case
  domain: Clinical reasoning
  cognitive_level: application
  text: >
    A kidney transplant recipient presents 3 months post-transplant with rising
    creatinine, low-grade fever and reduced urine output. Outline your
    differential diagnosis and initial diagnostic approach.
  expected_key_points:
    - "The differential diagnosis includes acute rejection (cellular/AMR), infection (BK nephropathy, CMV, UTI/pyelonephritis), CNI toxicity, obstruction/urological cause, dehydration/pre-renal, and recurrence of original disease."
    - "Work-up includes blood tests with tacrolimus trough level, urinalysis/culture, BK and CMV viral load, renal ultrasound ± Doppler, and allograft biopsy if needed."
    - "The differential is appropriately prioritised for the 3-month post-transplant timeframe (e.g., rejection and BK nephropathy are primary considerations)."
  text_de: >
    Ein nierentransplantierter Patient stellt sich 3 Monate nach der Transplantation mit
    steigendem Kreatinin, leichtem Fieber und verminderter Urinausscheidung vor. Skizzieren
    Sie Ihre Differentialdiagnose und das initiale diagnostische Vorgehen.
  expected_key_points_de:
    - "Die Differenzialdiagnose umfasst akute Abstossung (zellulär/AMR), Infektion (BK-Nephropathie, CMV, HWI/Pyelonephritis), CNI-Toxizität, Obstruktion/urologische Ursache, Dehydratation/prärenal und Rekurrenz der Grunderkrankung."
    - "Die Abklärung umfasst Blutbild inkl. Tacrolimus-Talspiegel, Urinstatus/-kultur, BK- und CMV-Viruslast, Nierenultraschall ± Doppler und bei Bedarf Transplantatbiopsie."
    - "Die Differenzialdiagnose ist für den 3-Monate-Zeitrahmen nach Transplantation angemessen priorisiert (z.B. Abstossung und BK-Nephropathie als Hauptdiagnosen)."

- id: P08_consent_models
  domain: Ethics / law (Switzerland)
  cognitive_level: nuance
  text: >
    Explain the difference between opt-in (explicit consent) and opt-out
    (presumed consent) organ-donation models, and summarise the recent change to
    Switzerland's consent model.
  expected_key_points:
    - "Opt-in model: organ donation proceeds only with the individual's explicit prior consent."
    - "Opt-out (presumed consent) model: everyone is considered a potential donor unless they explicitly objected during their lifetime."
    - "Switzerland passed a referendum in 2022 (approximately 60% in favour) approving an 'extended' opt-out model where relatives retain a say."
    - "Implementation requires a national register and ordinances; it was deferred and did not take effect immediately after the vote."
  text_de: >
    Erklären Sie den Unterschied zwischen Opt-in- (ausdrückliche Einwilligung) und
    Opt-out- (mutmassliche Einwilligung) Modellen für die Organspende, und fassen Sie die
    jüngste Änderung des Schweizer Einwilligungsmodells zusammen.
  expected_key_points_de:
    - "Opt-in-Modell: Organspende erfolgt nur mit ausdrücklicher Vorabeinwilligung der Person."
    - "Opt-out-/mutmassliches-Einwilligungsmodell: Jede Person gilt als potenzielle Spenderin, sofern sie zu Lebzeiten keinen Widerspruch eingelegt hat."
    - "Die Schweiz verabschiedete 2022 eine Volksabstimmung (ca. 60% Ja) und billigte das 'erweiterte' Opt-out-Modell, bei dem Angehörige ein Mitspracherecht behalten."
    - "Die Umsetzung erfordert ein nationales Register und Verordnungen; sie wurde aufgeschoben und trat nicht unmittelbar nach der Abstimmung in Kraft."
